# 애플리케이션 배포 (ADR 0023)
#   PR      : test (백엔드 테스트, Compose·스크립트 검사)
#   main    : test → deploy (production 승인 후)
#             ARM 러너에서 이미지 빌드 → ECR push → 배포 묶음 S3 업로드 → SSM으로 서버에서 deploy.sh → 헬스 체크
# 인프라 변경은 terraform.yml이 맡는다. 이 워크플로는 서버 안의 컨테이너만 바꾼다.
name: deploy

on:
  pull_request:
    paths:
      - "backend/**"
      - "deploy/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치지 않게 한다. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: dowha-plant-prod/backend
  SITE_URL: https://dowha-plant.shop

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    # 테스트는 운영과 같은 PostgreSQL 버전으로 (CHECK 제약, 부분 인덱스, JSONB)
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: dowha
          POSTGRES_PASSWORD: dowha
          POSTGRES_DB: dowha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dowha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # 마이그레이션 왕복, 모델과 마이그레이션 차이(alembic check), DB 제약, 헬스 체크
      - name: 백엔드 테스트
        working-directory: backend
        env:
          DATABASE_URL: postgresql://dowha:dowha@127.0.0.1:5432/dowha
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q -p no:cacheprovider

      - name: Compose 설정 검사
        working-directory: deploy
        run: |
          for k in ORIGIN_DOMAIN ORIGIN_VERIFY_SECRET POSTGRES_PASSWORD UMAMI_DB_PASSWORD \
                   UMAMI_APP_SECRET GRAFANA_ADMIN_PASSWORD BACKEND_IMAGE \
                   TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do echo "$k=x"; done > ci.env
          docker compose --env-file ci.env config --quiet
          docker compose --env-file ci.env --profile dashboard config --quiet

      # 운영과 같은 길이(48자)의 비밀값과 테스트 인증서로 nginx -t를 돌린다.
      # 짧은 값으로만 확인했다가 map_hash_bucket_size 오류로 첫 배포가 실패한 적이 있다.
      - name: Nginx 설정 검사
        working-directory: deploy
        run: |
          image="$(docker compose --env-file ci.env config --format json | jq -r .services.nginx.image)"
          certs="$(mktemp -d)"
          live="$certs/live/origin.dowha-plant.shop"
          mkdir -p "$live"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1             -subj "/CN=origin.dowha-plant.shop" -keyout "$live/privkey.pem" -out "$live/fullchain.pem" 2>/dev/null
          docker run --rm             --add-host api:127.0.0.1 --add-host umami:127.0.0.1             -e ORIGIN_DOMAIN=origin.dowha-plant.shop             -e ORIGIN_VERIFY_SECRET="$(openssl rand -hex 24)"             -e NGINX_ENVSUBST_FILTER='^ORIGIN_'             -v "$PWD/nginx/templates:/etc/nginx/templates:ro"             -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"             -v "$certs:/etc/letsencrypt:ro"             "$image" nginx -t

      - name: 셸 스크립트 검사
        run: shellcheck deploy/scripts/*.sh deploy/postgres/init/*.sh

  deploy:
    name: deploy (prod)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm   # 서버(t4g)와 같은 ARM이라 에뮬레이션 없이 빌드
    environment: production     # 승인 후 실행, 배포 역할은 이 환경에서만 쓸 수 있다
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: AWS 로그인 (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 배포 대상 확인
        id: target
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          {
            echo "registry=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            echo "release_bucket=dowha-plant-prod-backup-${account_id}"
            echo "tag=${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"
          instance_id="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:Name,Values=dowha-plant-prod-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text 2>/dev/null || true)"
          echo "instance_id=${instance_id}" >> "$GITHUB_OUTPUT"

      - name: ECR 로그인
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.target.outputs.registry }}"

      # 태그가 IMMUTABLE이라 같은 커밋을 다시 배포하면 빌드를 건너뛴다.
      - name: 백엔드 이미지 빌드·push
        env:
          IMAGE: ${{ steps.target.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.target.outputs.tag }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "이미 있는 이미지: $IMAGE"
            exit 0
          fi
          docker build --platform linux/arm64 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: 배포 묶음 업로드
        env:
          KEY: releases/${{ steps.target.outputs.tag }}.tgz
          BUCKET: ${{ steps.target.outputs.release_bucket }}
        run: |
          tar -czf release.tgz -C deploy .
          aws s3 cp release.tgz "s3://${BUCKET}/${KEY}" --only-show-errors

      - name: 서버에서 배포 (SSM)
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          BUCKET: ${{ steps.target.outputs.release_bucket }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "실행 중인 서버를 찾지 못했습니다"
            exit 1
          fi

          # 서버에서 실행할 명령. .env와 Alertmanager 렌더링 결과는 서버에만 있으므로 지우지 않는다.
          cat > remote.sh <<EOF
          set -euo pipefail
          export AWS_DEFAULT_REGION=${AWS_REGION}
          tmp=\$(mktemp -d)
          aws s3 cp "s3://${BUCKET}/releases/${TAG}.tgz" "\$tmp/release.tgz" --only-show-errors
          mkdir -p "\$tmp/new" && tar -xzf "\$tmp/release.tgz" -C "\$tmp/new"
          cd /opt/dowha
          rm -rf nginx postgres scripts systemd monitoring/prometheus monitoring/grafana compose.yaml README.md
          cp -a "\$tmp/new/." /opt/dowha/
          rm -rf "\$tmp"
          ./scripts/deploy.sh "${TAG}"
          echo "${TAG}" > RELEASE
          EOF

          params="$(jq -n --rawfile s remote.sh '{commands: [$s], executionTimeout: ["900"]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${TAG}" \
            --parameters "$params" \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"

          # 최초 배포는 이미지 pull과 인증서 발급으로 몇 분 걸린다 (최대 15분 대기)
          status=Pending
          for _ in $(seq 1 90); do
            sleep 10
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "상태: $status"
          [ "$status" = "Success" ]

      # 지금은 오류 페이지(404.html, error.html)만 있다. 5단계부터 Next.js 빌드 결과를 올린다.
      # files/ 아래(소개서 PDF)는 서버가 관리하므로 건드리지 않는다. 아직 --delete는 쓰지 않는다.
      - name: 정적 사이트 업로드
        run: |
          bucket="$(aws ssm get-parameter --name /dowha-plant/prod/deploy/site-bucket --query Parameter.Value --output text)"
          dist="$(aws ssm get-parameter --name /dowha-plant/prod/deploy/cloudfront-distribution-id --query Parameter.Value --output text)"
          aws s3 sync frontend/public "s3://${bucket}/" --exclude "files/*"             --cache-control "public, max-age=300" --only-show-errors
          id="$(aws cloudfront create-invalidation --distribution-id "$dist" --paths "/*"             --query Invalidation.Id --output text)"
          echo "캐시 무효화: $id"
          aws cloudfront wait invalidation-completed --distribution-id "$dist" --id "$id"

      # /ready는 DB 연결까지 확인한다 (마이그레이션 실패나 DB 장애를 잡는다)
      - name: 헬스 체크 (CloudFront 경유)
        run: |
          ok=false
          for i in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/v1/health/ready" || true)"
            echo "시도 $i: $code"
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 10
          done
          $ok

          # 없는 주소는 S3 403 → 404 페이지(404 응답)로 바뀌어야 한다 (ADR 0021)
          code="$(curl -s -o page.html -w '%{http_code}' "$SITE_URL/__deploy-check-missing-page")"
          echo "없는 페이지: $code"
          [ "$code" = "404" ] && grep -q '찾으시는 페이지가 없어요' page.html
