name: terraform

# PR: 포맷·검증 + plan (읽기 전용 역할)
# main 반영: plan → 변경 확인 → (변경 있을 때만) production 승인 1번 → 검토한 plan 그대로 apply
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에서 겹쳐 실행되지 않게 한다. apply 도중 취소되면 상태가 꼬일 수 있으므로 취소하지 않는다.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TF_VERSION: 1.15.3
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  check:
    name: fmt / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra

      - name: terraform validate
        run: |
          for stack in infra/bootstrap infra/global infra/envs/prod; do
            echo "::group::$stack"
            terraform -chdir="$stack" init -backend=false
            terraform -chdir="$stack" validate
            echo "::endgroup::"
          done

  plan:
    name: plan (${{ matrix.name }})
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 토큰 발급
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bootstrap
            path: infra/bootstrap
          - name: global
            path: infra/global
          - name: prod
            path: infra/envs/prod
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: AWS 로그인 (plan 역할, OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # backend.hcl은 계정 ID가 들어 있어 git에 올리지 않는다. 로그인한 계정에서 버킷 이름을 만든다.
      # 스택 폴더 깊이가 달라서(envs/prod) 절대 경로를 쓴다.
      - name: backend 설정 생성
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          cat > "$GITHUB_WORKSPACE/infra/backend.hcl" <<EOF
          bucket       = "dowha-plant-tfstate-${account_id}"
          region       = "${AWS_REGION}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: terraform init
        run: terraform init -backend-config="$GITHUB_WORKSPACE/infra/backend.hcl"

      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -lock-timeout=5m -detailed-exitcode -out=tfplan -no-color > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "true" > has_changes; else echo "false" > has_changes; fi

      - name: plan 요약
        run: |
          {
            echo "### ${{ matrix.name }}"
            if [ "$(cat has_changes)" = "true" ]; then
              echo "변경 있음"
              echo '```'
              grep -E "^\s+# |^Plan:" plan.txt || true
              echo '```'
            else
              echo "변경 없음"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # main에서만 apply 단계로 plan 파일을 넘긴다.
      - name: plan 파일 업로드
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ matrix.name }}
          path: |
            ${{ matrix.path }}/tfplan
            ${{ matrix.path }}/has_changes
          retention-days: 3

  # plan 결과를 모아 apply할 스택을 정한다. 변경이 없으면 승인 요청 자체를 띄우지 않는다.
  changes:
    name: 변경 확인
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.collect.outputs.stacks }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tfplan-*
          path: plans

      - name: 변경 있는 스택
        id: collect
        run: |
          stacks=""
          for name in bootstrap global prod; do   # 적용 순서
            if [ "$(cat "plans/tfplan-$name/has_changes")" = "true" ]; then
              stacks="$stacks $name"
            fi
          done
          stacks="${stacks# }"
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"
          echo "### apply 대상: ${stacks:-없음}" >> "$GITHUB_STEP_SUMMARY"

  # 승인 한 번으로 변경 있는 스택을 순서대로 apply한다 (예전에는 스택마다 승인을 받았다).
  apply:
    name: apply
    needs: changes
    if: needs.changes.outputs.stacks != ''
    runs-on: ubuntu-latest
    # production 환경: 승인자 확인 후 실행된다. apply 역할은 이 환경에서만 쓸 수 있다.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: tfplan-*
          path: plans

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: AWS 로그인 (apply 역할, OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: backend 설정 생성
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          cat > "$GITHUB_WORKSPACE/infra/backend.hcl" <<EOF
          bucket       = "dowha-plant-tfstate-${account_id}"
          region       = "${AWS_REGION}"
          encrypt      = true
          use_lockfile = true
          EOF

      # 승인 전에 검토한 plan 파일을 그대로 적용한다. 그 사이 상태가 바뀌었으면 Terraform이 거부한다.
      # 앞 스택이 실패하면 뒤 스택은 apply하지 않는다.
      - name: terraform apply
        env:
          STACKS: ${{ needs.changes.outputs.stacks }}
        run: |
          declare -A path=([bootstrap]=infra/bootstrap [global]=infra/global [prod]=infra/envs/prod)
          for name in $STACKS; do
            dir="${path[$name]}"
            echo "::group::apply $name ($dir)"
            cp "plans/tfplan-$name/tfplan" "$dir/tfplan"
            terraform -chdir="$dir" init -backend-config="$GITHUB_WORKSPACE/infra/backend.hcl"
            terraform -chdir="$dir" apply -lock-timeout=5m -no-color tfplan
            echo "::endgroup::"
            echo "- $name: 적용 완료" >> "$GITHUB_STEP_SUMMARY"
          done
