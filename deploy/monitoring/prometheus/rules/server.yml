# 알림은 Grafana가 아니라 이 규칙과 Alertmanager가 보낸다 (Grafana가 꺼져 있어도 알림이 온다, ADR 0022).
# 서버 전체가 멈춘 경우는 여기서 알 수 없으므로 UptimeRobot이 맡는다 (ADR 0019).
groups:
  - name: server
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} 수집 실패 (5분)"

      # ADR 0022 서버 키우는 기준: 스왑 500MB 초과 지속
      - alert: SwapHigh
        expr: (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) > 500 * 1024 * 1024
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "스왑 사용량 {{ $value | humanize1024 }}B (1시간 이상). t4g.small 검토"

      - alert: MemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "사용 가능한 메모리 5% 미만 (10분)"

      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "루트 디스크 여유 공간 {{ $value | humanizePercentage }}"

      # standard 크레딧이라 크레딧을 다 쓰면 기본 성능(10%)으로 느려진다 (ADR 0022)
      - alert: CpuHighSustained
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[10m])) > 0.5
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "CPU 사용률 50% 이상 30분 지속 (CPU 크레딧 소진 위험)"

  - name: app
    rules:
      # Nginx가 IP당 1분 5회로 막으므로, 15분에 10회 넘게 틀리면 여러 IP에서 시도하는 것일 수 있다
      - alert: AdminLoginFailures
        expr: increase(dowha_admin_logins_total{result="failure"}[15m]) > 10
        labels:
          severity: warning
        annotations:
          summary: "관리자 로그인 실패 {{ $value | printf \"%.0f\" }}회 (15분). 본인이 아니면 비밀번호를 바꾸세요 (set-password)"

      # 보관 기간이 지난 개인정보가 남아 있다 (삭제 타이머가 멈췄거나 삭제 코드 오류). 법적 의무라 경보
      - alert: PiiPurgeOverdue
        expr: dowha_inquiries_pii_overdue > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "보관 기간이 지난 문의 {{ $value }}건의 개인정보가 남아 있어요. journalctl -u dowha-pii-purge 확인"

      # 문의 알림이 실패하면 사장님이 문의를 놓칠 수 있다
      - alert: InquiryNotificationFailed
        expr: increase(dowha_notifications_failed_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "문의 알림(텔레그램) 실패 {{ $value }}건. 관리 화면에서 새 문의를 확인하세요"
