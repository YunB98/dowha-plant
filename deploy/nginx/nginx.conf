worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 실제 손님 IP. CloudFront는 X-Forwarded-For 끝에 손님 IP를 덧붙이므로,
    # recursive를 끈 채 마지막 값을 쓴다 (손님이 앞쪽을 위조해도 무시된다).
    # 보안 그룹이 CloudFront만 허용하므로 모든 출발지를 신뢰한다.
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;

    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    '$request_time "$http_user_agent" cf=$http_x_amz_cf_id';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # 오리진 비밀값(48자)을 map 키로 쓴다. 기본 버킷(64바이트, CPU 캐시 라인 크기)에 들어가지 않아
    # nginx가 시작하지 못했다 (2026-11-24 첫 배포 장애).
    map_hash_bucket_size 128;

    # 요청 수 제한 (api-spec 4장). 위 real_ip 설정 덕분에 $binary_remote_addr가 실제 손님 IP다.
    # 문의: 1분에 1회 + 순간 4회 → 한 번에 5회까지, 이후 1분에 1회 (10분에 약 5회 수준)
    limit_req_zone $binary_remote_addr zone=inquiry:1m rate=1r/m;
    # 관리자 로그인: 1분에 5회 (비밀번호 대입 방지). 실패가 계속되면 AdminLoginFailures 경보
    limit_req_zone $binary_remote_addr zone=login:1m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:2m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=qr:1m rate=5r/s;
    limit_req_status 429;
    limit_req_log_level warn;
    client_max_body_size 1m;   # 사진은 S3로 직접 올리므로 API 요청은 작다

    include /etc/nginx/conf.d/*.conf;
}
