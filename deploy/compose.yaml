# 도화 prod 서버 (EC2 t4g.micro, 메모리 1GB + 스왑 2GB)
# 모든 컨테이너에 mem_limit을 건다 (ADR 0022 메모리 예산).
# 외부에 열리는 포트는 Nginx 443 하나뿐이고, 관리 화면은 127.0.0.1에만 묶어 SSM 포트 포워딩으로 접속한다.
#
#   docker compose up -d                                   # 상시 실행
#   docker compose --profile dashboard up -d grafana       # 대시보드 볼 때만
#   docker compose --profile dashboard stop grafana

name: dowha

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    mem_limit: 32m
    ports:
      - "443:443"
    environment:
      ORIGIN_DOMAIN: ${ORIGIN_DOMAIN}
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET}
      # 템플릿 안의 nginx 변수($host 등)는 건드리지 않고 이 두 값만 치환한다.
      NGINX_ENVSUBST_FILTER: "^ORIGIN_"
    # 설정이 바뀌면 이 값이 바뀌어 compose가 컨테이너를 다시 만든다 (deploy.sh가 계산).
    # bind mount는 배포가 폴더를 지우고 새로 복사하면 지워진 옛 폴더를 계속 가리키기 때문이다.
    labels:
      dowha.config-hash: ${NGINX_CONFIG_HASH:-none}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  api:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    mem_limit: 160m
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql://dowha:${POSTGRES_PASSWORD}@postgres:5432/dowha
      SESSION_SECRET: ${SESSION_SECRET}
      # 사진·소개서 업로드. AWS 자격 증명은 EC2 인스턴스 역할(IMDSv2, hop limit 2)에서 받는다
      AWS_REGION: ap-northeast-2
      SITE_BUCKET: ${SITE_BUCKET}
      MEDIA_BUCKET: ${MEDIA_BUCKET}
      CLOUDFRONT_DISTRIBUTION_ID: ${CLOUDFRONT_DISTRIBUTION_ID}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    mem_limit: 192m
    shm_size: 64m
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=256MB
    environment:
      POSTGRES_USER: dowha
      POSTGRES_DB: dowha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dowha -d dowha"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  umami:
    image: ghcr.io/umami-software/umami:postgresql-v2.19.0
    restart: unless-stopped
    mem_limit: 256m   # 로컬 측정: 대기 중 anon 약 173MB (ADR 0022 측정값)
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=160
    ports:
      - "127.0.0.1:3000:3000"   # 관리 화면 (SSM 포트 포워딩)
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    mem_limit: 64m    # 로컬 측정: 약 23MB. 수집 대상이 적어 7일 보관도 작다
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    labels:
      dowha.config-hash: ${PROMETHEUS_CONFIG_HASH:-none}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    mem_limit: 32m
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    labels:
      dowha.config-hash: ${ALERTMANAGER_CONFIG_HASH:-none}
    volumes:
      # deploy.sh가 SSM 값으로 만든 설정 파일 (텔레그램 채팅 ID와 봇 토큰)
      - ./monitoring/alertmanager/rendered:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    mem_limit: 32m
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.netdev
      - --collector.diskstats
      - --collector.pressure
      - --collector.vmstat
      - --collector.uname
      - --collector.time
    pid: host
    volumes:
      - /:/host:ro,rslave
    logging: *logging

  grafana:
    image: grafana/grafana:12.0.2
    profiles: ["dashboard"]
    restart: "no"
    mem_limit: 128m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    logging: *logging

volumes:
  pgdata:
  prometheus-data:
  alertmanager-data:
  grafana-data:
