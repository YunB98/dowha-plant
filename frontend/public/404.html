<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 · 식물가게 도화</title>
<!-- CloudFront 오류 페이지 (403/404 → 404, ADR 0021). 외부 파일 없이 이 파일만으로 보여야 한다. -->
<style>
  :root { --bg:#f6f4ee; --card:#fffdf8; --ink:#2f3a2f; --muted:#6b7464; --leaf:#4f7a4a; --line:#e4e0d4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1f1a; --card:#232922; --ink:#e8ebe4; --muted:#a3ab9c; --leaf:#8fbf86; --line:#343b32; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:var(--bg); color:var(--ink);
         font:16px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
         border-radius:20px; padding:36px 28px; text-align:center; }
  .leaf { width:56px; height:56px; margin:0 auto 18px; color:var(--leaf); }
  .code { margin:0; color:var(--muted); font-size:14px; letter-spacing:.08em; }
  h1 { margin:6px 0 10px; font-size:22px; line-height:1.4; }
  p { margin:0 0 24px; color:var(--muted); }
  nav { display:grid; gap:10px; }
  a { display:block; padding:13px 16px; border-radius:12px; text-decoration:none; font-weight:600; }
  .primary { background:var(--leaf); color:#fff; }
  .secondary { border:1px solid var(--line); color:var(--ink); }
  a:focus-visible { outline:3px solid var(--leaf); outline-offset:2px; }
  footer { margin-top:22px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <svg class="leaf" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
    <path d="M32 56V30"/><path d="M32 34c0-12 8-20 20-20 0 12-8 20-20 20Z"/><path d="M32 42c0-9-6-15-15-15 0 9 6 15 15 15Z"/>
  </svg>
  <p class="code">404</p>
  <h1>찾으시는 페이지가 없어요</h1>
  <p>주소가 바뀌었거나 없어진 페이지예요.<br>아래에서 원하시는 곳으로 이동해 주세요.</p>
  <nav>
    <a class="primary" href="/">도화 홈으로</a>
    <a class="secondary" href="/guides/">식물 관리 가이드 보기</a>
  </nav>
  <footer>식물가게 도화 · 전주</footer>
</main>
</body>
</html>
